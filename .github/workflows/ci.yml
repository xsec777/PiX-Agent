name: PiX CI & Mechanism Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & Offline Acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install extension dependencies
        run: npm --prefix extension ci --ignore-scripts --no-fund --no-audit

      - name: Typecheck extension
        run: node extension/node_modules/typescript/bin/tsc -p extension/tsconfig.json

      - name: Run mechanism acceptance
        run: node --experimental-strip-types acceptance/matrix.test.ts

      - name: Run Swarm primitive contract tests
        run: |
          set -e
          for test in task-envelope termination watchdog worker-pool worker-result swarm concurrency throttler; do
            node --experimental-strip-types "acceptance/$test.test.ts"
          done

      - name: Run credential-scope regression
        run: |
          TEST_ROOT=$(mktemp -d)
          cd "$TEST_ROOT"
          node --experimental-strip-types "$GITHUB_WORKSPACE/acceptance/cred-vault-scope.test.ts"

      - name: Run tactical-loader regression
        run: node --experimental-strip-types acceptance/tactical-loader-v2.7.test.ts

      - name: Verify Environment Doctor
        run: node scripts/pix-doctor.mjs
