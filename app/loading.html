<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PiX</title>
  <style>
    body {
      margin: 0;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .logo-wrap {
      position: relative;
      margin-bottom: 24px;
    }
    .logo {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      animation: pulse-glow 2.2s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.4));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 28px rgba(239, 68, 68, 0.85));
      }
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    .status {
      font-size: 13px;
      color: #94a3b8;
    }
    .spinner {
      margin-top: 20px;
      width: 24px;
      height: 24px;
      border: 2px solid rgba(239, 68, 68, 0.2);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img class="logo" src="icon.png" alt="PiX">
  </div>
  <div class="title">PiX</div>
  <div class="status" id="status-text">正在启动渗透工作台...</div>
  <div class="spinner"></div>
</body>
</html>
